<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="keywords" content="Slack, UI, Skeleton" />
    <meta name="description"
        content="A single-page skeleton UI clone of Slack’s message page, designed to replicate the core layout and structure for learning and frontend practice." />
    <meta name="keywords" content="Slack, UI, Skeleton, Frontend, Practice" />
    <meta name="author" content="Kushal" />
    <meta property="og:title" content="Slack Skeleton UI" />

    <link rel="icon" href="/assets/icons/slack.svg">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/aside.css">
    <link rel="stylesheet" href="/styles/main.css">
    <title>Slack Messages page layout</title>
</head>

<body>
    <header class="header">
        <div class="header-buttons">
            <button id="close" title="Close window" aria-label="Close window"></button>
            <button id="minimize" title="Minimize window" aria-label="Minimize window"></button>
            <button id="maximize" title="Maximize window" aria-label="Maximize window"></button>
        </div>

        <div class="header-search">
            <img src="/assets/icons/clock.svg" alt="History Icon" class="history-icon" title="History">
            <form class="search-bar" role="search">
                <input type="search" name="search" placeholder="Search A1 Marketing Ltd." class="search-input"
                    title="Search">
            </form>
        </div>

        <div class="header-profile">
            <img src="/assets/images/profile-kushal.png" class="profile-image" alt="Profile Image" title="Profile">
            <div id="user-status"></div>
        </div>
    </header>

    <aside class="aside">
        <section class="side-header">
            <div class="project-name">
                <h3>Acme</h3>
                <button class="project-menu" title="Project menu" aria-label="Project menu">
                    <img class="nav-icon" src="/assets/icons/dropdown.svg" alt="Project menu icon">
                </button>
            </div>

            <div class="new-post">
                <button class="new-post-button" title="New post" aria-label="New post">
                    <img class="nav-icon bg-white" src="/assets/icons/edit.svg" alt="New post icon">
                </button>
            </div>
        </section>

        <section class="side-content">
            <div class="tools-nav">
                <nav>
                    <ul>
                        <li><button class="nav-button" title="Threads" aria-label="Threads"><img class="nav-icon"
                                    src="/assets/icons/canvas.svg" alt="">Canvases</button></li>
                        <li><button class="nav-button" title="Mentions & reactions"
                                aria-label="Mentions & reactions"><img class="nav-icon"
                                    src="/assets/icons/slack-content.svg" alt="">Slack content</button></li>
                        <li><button class="nav-button" title="Saved items" aria-label="Saved items"><img
                                    class="nav-icon" src="/assets/icons/files.svg" alt="">Files</button></li>
                        <li><button class="nav-button" title="More items" aria-label="More items"><img class="nav-icon"
                                    src="/assets/icons/three-dots-vertical.svg" alt="">Browse Slack</button></li>
                    </ul>
                </nav>
            </div>

            <div class="channels">
                <nav>
                    <ul>
                        <li><button class="nav-button" title="Channels" aria-label="Channels"><img class="nav-icon"
                                    src="/assets/icons/dropdown.svg" alt="">Channels</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/hash.svg" alt="">general</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/hash.svg" alt="">marketing</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/hash.svg" alt="">product</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/hash.svg" alt="">sales</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/hash.svg" alt="">operation</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/lock.svg" alt="">fundraising</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/lock.svg" alt="">leadership</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-icon"
                                    src="/assets/icons/plus.svg" alt="">Add channels</button></li>
                    </ul>
                </nav>
            </div>

            <div class="direct-messages">
                <nav>
                    <ul>
                        <li><button class="nav-button" title="Direct messages" aria-label="Direct messages">
                                <img class="nav-icon" src="/assets/icons/dropdown.svg" alt="">Direct messages
                            </button>
                        </li>
                        <li>
                            <button class="nav-button" title="" aria-label="">
                                <img class="nav-photo" src="/assets/icons/slackbot.svg" alt="">Slackbot</button>
                        </li>
                        <li>
                            <button class="nav-button" title="" aria-label="">
                                <img class="nav-photo" src="/assets/images/profile-kushal.png" alt="">Kushal</button>
                        </li>
                        <li>
                            <button class="nav-button selected" title="" aria-label="">
                                <img class="nav-photo" src="/assets/images/profile-vatsal.png" alt="">Vatsal</button>
                        </li>
                        <li>
                            <button class="nav-button" title="" aria-label="">
                                <img class="nav-photo" src="/assets/images/profile-3.png" alt="">Alex</button>
                        </li>
                        <li><button class="nav-button" title="" aria-label=""><img src="/assets/icons/plus.svg"
                                    alt="">Add channels</button></li>
                    </ul>
                </nav>
            </div>

            <div class="apps">
                <nav>
                    <ul>
                        <li><button class="nav-button" title="Apps" aria-label="Apps"><img
                                    src="/assets/icons/dropdown.svg" alt="">Apps</button></li>
                        <li><button class="nav-button" title="" aria-label=""><img class="nav-photo"
                                    src="/assets/images/profile-3.png" alt="">Good app</button></li>
                    </ul>
                </nav>
            </div>
        </section>

        <section class="side-footer">
            <div class="user-name">
                <button>
                    Kushal Zinzuvadia
                    <img class="nav-icon" src="/assets/icons/dropdown.svg" alt="">
                </button>
            </div>
            <div>
                <button>
                    <img class="nav-icon bg-white" src="/assets/icons/audio-mike.svg" alt="toggle microphone"
                        title="Toggle microphone">
                </button>
            </div>
        </section>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        <section class="profile-info">
            <div class="profile">
                <img src="/assets/images/profile-kushal.png" alt="Kushal Zinzuvadia" class="profile-image-large">
                <h2>Kushal Zinzuvadia</h2>
            </div>
            <div class="bookmark">
                <button>
                    <img class="nav-icon" src="/assets/icons/plus.svg" alt="Add Bookmark" title="Add Bookmark">
                    Add a bookmark
                </button>
            </div>
            <div class="profile-details">
                <div class="profile-big">
                    <img src="/assets/images/profile-kushal.png" alt="Kushal Zinzuvadia" class="profile-image-large">
                    <h2>Kushal Zinzuvadia</h2>
                    <div class="maximize"></div>
                </div>
                <div class="disclaimer">
                    <p>This conversation is just between </p>
                    <div class="user-mention">@Decio Emanuel</div>
                    <p>and you. Check out their profile to learn more about them.</p>
                </div>
                <div class="view-profile">
                    <button title="View profile" aria-label="View profile" class="view-profile">
                        View profile
                    </button>
                </div>
            </div>
        </section>

        <section class="chat">
            <div class="chat-history">chat history</div>
            <div class="new-msg">new msg</div>
        </section>
    </main>
</body>

</html>
